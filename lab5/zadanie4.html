<body>
    <script>
        function silnia(n) {
  if (n === 0 || n === 1) return 1;
  return n * silnia(n - 1);
}

function wypiszSilnia(n) {
  console.log(silnia(n));
}


wypiszSilnia(5); 
    </script>
</body>
