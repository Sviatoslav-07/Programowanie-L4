    <script>
        function naHex(n) {
  const hex = "0123456789ABCDEF";
  let wynik = "";

  while (n > 0) {
    let reszta = n % 16;
    wynik = hex[reszta] + wynik;
    n = Math.floor(n / 16);
  }

  console.log(wynik);
}

naHex(180); 
    </script>
