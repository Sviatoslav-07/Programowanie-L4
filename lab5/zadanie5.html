<body>
    <script>
        function przyblizPi(n) {
  let suma = 0;

  for (let i = 0; i < n; i++) {
    const znak = i % 2 === 0 ? 1 : -1;
    suma += znak * (1 / (2 * i + 1));
  }

  const wynik = 4 * suma;
  console.log(wynik);
}

przyblizPi(100000);
    </script>
</body>
