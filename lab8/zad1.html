<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 1</title>
</head>
<body>
    <form id="userForm">
        <label>Imię: <input type="text" id="imie"></label><br>
        <label>Nazwisko: <input type="text" id="nazwisko"></label><br>
        <label>Wiek: <input type="number" id="wiek"></label><br>
        <button type="button" onclick="pobierzDane()">Wyślij formularz</button>
    </form>
    <script >
        function pobierzDane() {
    const imie = document.getElementById('imie').value;
    const nazwisko = document.getElementById('nazwisko').value;
    const wiek = Number(document.getElementById('wiek').value);

    const uzytkownik = {
        imie: imie,
        nazwisko: nazwisko,
        wiek: wiek
    };


    console.log("Cały obiekt:", uzytkownik);

    console.log("Imię:", uzytkownik.imie);
    console.log("Nazwisko:", uzytkownik.nazwisko);
    console.log("Wiek:", uzytkownik.wiek);

    const uzytkownikJSON = JSON.stringify(uzytkownik);
    console.log("Format JSON:", uzytkownikJSON);
}
    </script>
</body>
</html>
